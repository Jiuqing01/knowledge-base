server:
  port: 8081

spring:
  profiles:
    active: mysql

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms

jwt:
  secret: knowledge-base-management-system-secret-key-2024
  access-token-expire-minutes: 30
  refresh-token-expire-days: 7

app:
  default-storage-quota: 1073741824

file:
  upload-dir: uploads
  max-file-size: 524288000
  allowed-extensions:
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - jpg
    - jpeg
    - png
    - gif
    - bmp
    - webp
    - txt
    - md
    - zip
    - rar

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_base?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
